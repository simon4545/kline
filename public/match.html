<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>币安永续合约形态扫描</title>
    <link rel="stylesheet" href="./static/style.css">
    <script src="./static/draw.js"></script>
    <script src="./static/binance.js"></script>
</head>

<body>
    <h1>币安永续合约形态扫描</h1>

    <div id="controls">
        <div class="param-group">
            <label>
                相似度阈值: <input type="range" id="similarityThreshold" min="50" max="95" step="1" value="90">
                <span class="value-display" id="simVal">90%</span>
            </label>
        </div>

        <div class="param-group">
            <label>
                时间周期:
                <select name="requireInterval" id="requireInterval">
                    <option value="">--请选择时间--</option>
                    <option value="1h">1小时</option>
                    <option value="4h">4小时</option>
                    <option value="1d">日线</option>
                </select>
            </label>
        </div>
        <canvas id="drawCanvas"></canvas>
        <div id="pointList">
            <textarea id="pointsOutput" rows="5" readonly></textarea>
        </div>
        <button id="scanBtn">开始扫描形态</button>
    </div>

    <div id="progress">
        <div id="progress-bar"></div>
    </div>
    <div id="status">准备就绪</div>

    <h2>形态匹配结果 (<span id="matchCount">0</span>)</h2>
    <div id="results"></div>

    <script>

        let timeInterval = "1h";
        document.addEventListener('DOMContentLoaded', function () {
            const drawer = new LineDrawer("drawCanvas", "pointsOutput");
            const scanBtn = document.getElementById('scanBtn');
            const progressBar = document.getElementById('progress-bar');
            const statusElem = document.getElementById('status');
            const resultsElem = document.getElementById('results');
            const matchCountElem = document.getElementById('matchCount');
            const intervalElem = document.getElementById("requireInterval");

            intervalElem.addEventListener("change", (event) => {
                timeInterval = event.target.value;
            });
            document.getElementById('similarityThreshold').addEventListener('input', function (e) {
                document.getElementById('simVal').textContent = e.target.value + '%';
            });

            scanBtn.addEventListener('click', async function () {
                scanBtn.disabled = true;
                resultsElem.innerHTML = '';
                matchCountElem.textContent = '0';
                statusElem.textContent = '正在获取合约列表...';
                progressBar.style.width = '0%';

                try {
                    const contracts = await fetchBinanceContracts();
                    statusElem.textContent = `找到 ${contracts.length} 个合约代币`;

                    const similarityThreshold = parseFloat(document.getElementById('similarityThreshold').value) / 100;

                    const allResults = [];
                    let processed = 0;

                    for (const symbol of contracts) {
                        const progress = (processed / contracts.length) * 100;
                        progressBar.style.width = `${progress}%`;
                        statusElem.textContent = `处理中: ${symbol} (${processed + 1}/${contracts.length})`;

                        const klines = await fetchBinanceKlines(symbol, timeInterval, 200);
                        if (!klines || klines.length < 100) {
                            processed++;
                            continue;
                        }

                        let prices = klines.map(k => parseFloat(k[4]));
                        prices = prices.slice(-100)
                        drawer.simplifyLine();
                        const patternSeries = drawer.extractPattern(prices);
                        let similarity = drawer.calculateSimilarity(patternSeries);

                        if (similarity > similarityThreshold) {
                            similarity = similarity * 100;
                            let result = { symbol, similarity, prices }
                            allResults.push({ symbol, similarity });
                            console.log({ symbol, similarity })
                            renderResults(result);
                        }

                        processed++;
                    }

                    matchCountElem.textContent = allResults.length;

                    if (allResults.length === 0) {
                        resultsElem.innerHTML = '<div class="no-results">未找到符合条件的形态</div>';
                    }

                    statusElem.textContent = `扫描完成! 找到 ${allResults.length} 个形态`;

                } catch (error) {
                    console.error('扫描失败:', error);
                    statusElem.textContent = `错误: ${error.message}`;
                } finally {
                    scanBtn.disabled = false;
                }
            });

            function renderResults(result) {
                const resultElem = document.createElement('div');
                resultElem.className = 'result';
                resultElem.innerHTML = `
                        <div class="result-header">
                            <div class="symbol">${result.symbol}</div>
                            <div class="similarity">匹配度: ${result.similarity.toFixed(1)}%</div>
                        </div>
                        <div class="match-bar">
                            <div class="match-fill" style="width:${result.similarity}%"></div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-${result.symbol}"></canvas>
                        </div>
                    `;

                resultsElem.appendChild(resultElem);

                // 渲染图表
                setTimeout(() => { renderChart(result, document.getElementById(`chart-${result.symbol}`)); }, 100);

                // 更新匹配计数
                matchCountElem.textContent = parseInt(matchCountElem.textContent) + 1;
            }

            // 渲染K线图
            function renderChart(result, canvas) {
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;
                const padding = 40;
                const chartWidth = width - padding * 2;
                const chartHeight = height - padding * 2;

                ctx.clearRect(0, 0, width, height);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);

                const patternPrices = result.prices.slice();

                // 计算价格比例
                const maxPrice = Math.max(...patternPrices);
                const minPrice = Math.min(...patternPrices);
                const priceRange = maxPrice - minPrice;

                ctx.strokeStyle = '#ecf0f1';
                ctx.lineWidth = 1;

                // 水平网格线
                for (let i = 0; i <= 4; i++) {
                    const y = padding + (4 - i) * (chartHeight / 4);
                    ctx.beginPath();
                    ctx.moveTo(padding, y);
                    ctx.lineTo(width - padding, y);
                    ctx.stroke();
                }

                const pointCount = patternPrices.length;
                for (let i = 0; i < pointCount; i += Math.floor(pointCount / 5)) {
                    const x = padding + (i / (pointCount - 1)) * chartWidth;
                    ctx.beginPath();
                    ctx.moveTo(x, padding);
                    ctx.lineTo(x, height - padding);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.strokeStyle = '#3498db';
                ctx.lineWidth = 2;

                patternPrices.forEach((price, i) => {
                    const x = padding + (i / (pointCount - 1)) * chartWidth;
                    const y = padding + chartHeight - ((price - minPrice) / priceRange * chartHeight);

                    if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
                });
                ctx.stroke();

                ctx.strokeStyle = '#bdc3c7';
                ctx.lineWidth = 1;
                ctx.strokeRect(padding, padding, chartWidth, chartHeight);
            }

        });
    </script>
</body>

</html>
