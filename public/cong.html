<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>币安双向持仓交易助手 (Algo API 版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e11; color: #eaecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e2329; padding: 25px; border-radius: 16px; width: 420px; border: 1px solid #333; }
        h2 { text-align: center; color: #f3ba2f; margin: 0 0 20px 0; font-size: 18px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; color: #848e9c; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; background: #2b3139; border: 1px solid #474d57; border-radius: 4px; color: white; box-sizing: border-box; border: 1px solid transparent; }
        input:focus { border-color: #f3ba2f; outline: none; }
        .row { display: flex; gap: 10px; }
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .buy-btn { background: #02c076; color: white; }
        .sell-btn { background: #f6465d; color: white; }
        #log { margin-top: 15px; font-size: 11px; height: 160px; overflow-y: auto; background: #000; padding: 10px; border-radius: 6px; color: #00ff00; font-family: monospace; border: 1px solid #333; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>Binance Hedge (Algo Order)</h2>
    <div class="input-group"><label>API Key</label><input type="text" id="apiKey" oninput="saveData()"></div>
    <div class="input-group"><label>API Secret</label><input type="password" id="apiSecret" oninput="saveData()"></div>
    <div class="row">
        <div style="flex: 2;"><label>交易对</label><input type="text" id="symbol" value="BTCUSDT" oninput="saveData()"></div>
        <div style="flex: 1.5;"><label>金额 (USD)</label><input type="number" id="usdAmount" value="50" oninput="saveData()"></div>
    </div>
    <div class="btn-group">
        <button class="buy-btn" onclick="handleTrade('LONG')">做多开仓</button>
        <button class="sell-btn" onclick="handleTrade('SHORT')">做空开仓</button>
    </div>
    <div id="log">>> 状态：系统就绪</div>
</div>

<script>
    const BASE_URL = 'https://fapi.binance.com';

    // 1. LocalStorage 固定为 binance_
    const fields = ['apiKey', 'apiSecret', 'symbol', 'usdAmount'];
    window.onload = () => fields.forEach(id => {
        const v = localStorage.getItem('binance_' + id);
        if (v) document.getElementById(id).value = v;
    });

    function saveData() { 
        fields.forEach(id => localStorage.setItem('binance_' + id, document.getElementById(id).value)); 
    }

    function addLog(msg) {
        const b = document.getElementById('log');
        b.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        b.scrollTop = b.scrollHeight;
    }

    async function handleTrade(posSide) {
        const key = document.getElementById('apiKey').value;
        const secret = document.getElementById('apiSecret').value;
        const symbol = document.getElementById('symbol').value.toUpperCase();
        const usdValue = parseFloat(document.getElementById('usdAmount').value);

        try {
            addLog(`正在获取 ${symbol} 规则与价格...`);
            const [priceRes, infoRes] = await Promise.all([
                fetch(`${BASE_URL}/fapi/v1/ticker/price?symbol=${symbol}`),
                fetch(`${BASE_URL}/fapi/v1/exchangeInfo`)
            ]);
            const pData = await priceRes.json();
            const iData = await infoRes.json();
            const curPrice = parseFloat(pData.price);
            const sInfo = iData.symbols.find(s => s.symbol === symbol);

            const qty = (usdValue / curPrice).toFixed(sInfo.quantityPrecision);
            
            // 2. 开仓订单 - 使用普通接口 /fapi/v1/order
            const side = (posSide === 'LONG') ? 'BUY' : 'SELL';
            addLog(`1. 开仓 ${posSide}: ${qty} 币...`);
            await sendReq('/fapi/v1/order', key, secret, {
                symbol, side, positionSide: posSide,
                type: 'MARKET', quantity: qty
            });

            // 3. 止损单 - 使用策略单接口 /fapi/v1/algoOrder
            const stopSide = (posSide === 'LONG') ? 'SELL' : 'BUY';
            const stopPrice = (posSide === 'LONG') ? (curPrice * 0.95) : (curPrice * 1.05);
            const fixedStopPrice = stopPrice.toFixed(sInfo.pricePrecision);

            addLog(`2. 挂策略止损单: ${fixedStopPrice}...`);
            
            /**
             * 根据文档，对于平仓止损：
             * 使用 /fapi/v1/algoOrder
             * 必须参数: symbol, side, positionSide, type, stopPrice
             * 设置 closePosition: 'true' 时不传 quantity
             */
            await sendReq('/fapi/v1/algoOrder', key, secret, {
                symbol,
                algoType: "CONDITIONAL",
                side: stopSide,
                positionSide: posSide,
                type: 'STOP_MARKET',
                triggerprice: fixedStopPrice,
                // closePosition: 'true',
                quantity: qty,
                workingType: 'CONTRACT_PRICE'
            });

            addLog("✅ 任务全部执行成功！");
        } catch (e) { 
            addLog(`❌ 失败: ${e.message}`); 
            console.error(e);
        }
    }

    async function sendReq(endpoint, key, secret, params) {
        params.timestamp = Date.now();
        const query = Object.keys(params)
            .sort()
            .map(k => `${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`)
            .join('&');
            
        const sig = CryptoJS.HmacSHA256(query, secret).toString();
        
        // 注意：无需代理。如果报错跨域，请确保浏览器允许跨域或使用相应插件。
        const response = await fetch(`${BASE_URL}${endpoint}?${query}&signature=${sig}`, {
            method: 'POST', 
            headers: { 
                'X-MBX-APIKEY': key,
                'Content-Type': 'application/x-www-form-urlencoded'
            }
        });

        const data = await response.json();
        if (data.code && data.code !== 200) {
            throw new Error(`[代码 ${data.code}] ${data.msg}`);
        }
        return data;
    }
</script>
</body>
</html>
