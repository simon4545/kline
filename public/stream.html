<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联动图表</title>
  <link rel="stylesheet" href="https://unpkg.com/@tabler/core@1.0.0-beta3/dist/css/tabler.min.css">
  <style>
    #category-list {
      height: calc(100vh - 100px);
      overflow-y: scroll;
      padding: 0 1rem;
    }

    .category-item {
      cursor: pointer;

    }

    .category-name {
      /* font-size: 20px; */
      font-weight: 600;
    }

    .category-item.active {
      color: blueviolet !important;
      font-weight: 600;
      font-size: 1.3rem;
    }

    .show {
      display: block !important;
    }
  </style>
</head>

<body>
  <div class="container-fluid py-2">
    <div class="row mb-2 align-items-center">
      <div class="col-auto">
        <label for="interval-select" class="form-label mb-0">时间周期</label>
      </div>
      <div class="col-auto">
        <select id="interval-select" class="form-select">
          <option value="1m">1m</option>
          <option value="5m" selected>5m</option>
          <option value="15m">15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
          <option value="4h">4h</option>
          <option value="1d">1d</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="col col-xs-12 col-sm-12 col-lg-12">
        <div id="main" style="height:calc( 100vh - 140px )"></div>
      </div>
    </div>
  </div>

  <div class="modal modal-blur fade" id="loading-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-body">
          数据初始化中...
        </div>
      </div>
    </div>
  </div>

  <script type="text/html" id="category-template">
    <a class="list-group-item list-group-item-action d-flex align-items-center category-item" href="#" content_type="{{tag}}">
        {{name}}
        <small class="text-muted ms-auto">{{number}}</small>
      </a>
</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <script>
    let commonJs = {
      getTokenList() {
        return new Promise((resolve, reject) => {
          $.ajax({
            url: "https://fapi.1pan.me/hot",
            type: 'POST',
            success: function (data) {
              resolve(data)
            },
            error: function (error) {
              reject(error)
            },
          })
        })
      },
      getRandomColor() {
        return '#' +
          (function (color) {
            return (color += '0123456789abcdef'[Math.floor(Math.random() * 16)]) && (color.length == 6) ? color : arguments.callee(color);
          })('');
      },
      relativeUrl() {
        var loc = window.location, new_uri;
        if (loc.protocol === "https:") {
          new_uri = "wss:";
        } else {
          new_uri = "ws:";
        }
        new_uri += `//${loc.host}`;
        return new_uri
      }
    };
    Date.prototype.Format = function (fmt) {
      var o = {
        "M+": this.getMonth() + 1, //月份 
        "d+": this.getDate(), //日 
        "h+": this.getHours(), //小时 
        "m+": this.getMinutes(), //分 
        "s+": this.getSeconds(), //秒 
        "q+": Math.floor((this.getMonth() + 3) / 3), //季度 
        "S": this.getMilliseconds() //毫秒 
      };
      if (/(y+)/.test(fmt)) fmt = fmt.replace(RegExp.$1, (this.getFullYear() + "").substr(4 - RegExp.$1.length));
      for (var k in o)
        if (new RegExp("(" + k + ")").test(fmt)) fmt = fmt.replace(RegExp.$1, (RegExp.$1.length == 1) ? (o[k]) : (("00" + o[k]).substr(("" + o[k]).length)));
      return fmt;
    }
    
    $(function () {
      var myChart = echarts.init(document.getElementById('main'));
      let socketClient;
      let currentTokenList;
      let currentPriceMap;
      let globalColor;
      let currentInterval = '5m';

      async function init() {
        globalColor = {};
        currentPriceMap = {};
        currentTokenList = [];
        try {
          $("#loading-modal").toggleClass("show")
          let result = await commonJs.getTokenList()
          result.forEach(function (item, idx) {
            let obj = { Symbol: item.Symbol, Price: item.LastPrice, TimeStamp: new Date().valueOf(), Klines: item.Klines }
            currentTokenList.push(obj)
          })
          renderInfo()
        } catch (ex) {
          console.error(ex)
        }
      }
      init()
      setTimeout(init, 1000 * 60 * 5)

      async function renderInfo() {
        currentPriceMap = {};
        for (let i = 0; i < currentTokenList.length; i++) {
          let symbol = currentTokenList[i].Symbol;
          let color = commonJs.getRandomColor();
          globalColor[symbol] = { color, lineHeight: 10 }
          currentPriceMap[symbol] = [...currentTokenList[i].Klines]
        }

        dataFormat();
        setTimeout(() => {
          initSocket()
        }, 1 * 1000);
      }

      function initSocket() {
        let streams = currentTokenList.map((item) => {
          return item.Symbol.toLowerCase() + `usdt@kline_${currentInterval}`;
        })
        socketClient && socketClient.close();
        // socketClient = new WebSocket("wss://stream.binance.com:9443/stream?streams=" + streams.join("/"));
        // socketClient = new WebSocket(`${commonJs.relativeUrl()}/stream?streams=${streams.join("/")}`);
        socketClient = new WebSocket("wss://fapi.1pan.me/stream?streams=" + streams.join("/"));
        socketClient.onopen = function (e) {
          $("#loading-modal").toggleClass("show")
          console.log("[open] Connection established");
          console.log("Sending to server");
        };
        socketClient.onmessage = function (result) {
          // console.log(`[message] Data received from server: ${event.data}`);
          var streamInfo = JSON.parse(result.data);
          renderStream(streamInfo);
        };
        socketClient.onclose = function (event) {
          if (event.wasClean) {
            console.log(`[close] Connection closed cleanly, code=${event.code} reason=${event.reason}`);
          } else {
            console.log('[close] Connection died');
          }
        };
        socketClient.onerror = function (error) {
          console.log(`[error] ${error.message}`);
        };
      }

      async function renderStream(message) {
        try {
          if (message.stream.indexOf(`kline_${currentInterval}`) >= 0) {
            let pair = message.data.s.toLowerCase();
            let k = message.data.k;
            let symbol = pair.replace("usdt", "").toUpperCase();
            updateKline(symbol, {
              Symbol: symbol,
              Price: k.c,
              TimeStamp: k.T,
            });
          }
        } catch (err) {
          console.log(err)
        }
      }

      async function updateKline(symbol, newData) {
        if (!currentPriceMap[symbol] || !currentPriceMap[symbol].length) {
          return;
        }
        let lastPriceObject = currentPriceMap[symbol][currentPriceMap[symbol].length - 1];
        if (!lastPriceObject) {
          return
        }
        if (lastPriceObject.TimeStamp == newData.TimeStamp) {
          currentPriceMap[symbol][currentPriceMap[symbol].length - 1] = newData;
        } else {
          currentPriceMap[symbol].push(newData);
        }
        dataFormat()
      }

      function dataFormat() {
        let _rawData = [["Symbol", "Price", "Time"]];
        let symbols = [];
        let startTime;
        for (let key in currentPriceMap) {
          symbols.push(key);
          let list = currentPriceMap[key];
          if (list && list.length) {
            for (let i = 0; i < list.length; i++) {
              let item = list[i];
              let closeTime = item.TimeStamp;
              if (i == 0) {
                startTime = item.TimeStamp;
                _rawData.push([key, 1, closeTime])
              } else {
                let percent;
                if (list[0].Price == 0) {
                  percent = 1;
                } else {
                  percent = Number(1 + (item.Price - list[0].Price) / list[0].Price).toFixed(4);
                }
                _rawData.push([key, Number(percent), closeTime])
              }
            }
          }
        }
        renderChart(_rawData, symbols, startTime);
      }

      function renderChart(_rawData, symbols, startTime) {
        const datasetWithFilters = [];
        const seriesList = [];
        echarts.util.each(symbols, function (symbol) {
          var datasetId = 'dataset_' + symbol;
          datasetWithFilters.push({
            id: datasetId,
            fromDatasetId: 'dataset_raw',
            transform: {
              type: 'filter',
              config: {
                and: [
                  { dimension: 'Time', gte: startTime },
                  { dimension: 'Symbol', '=': symbol }
                ]
              }
            }
          });
          seriesList.push({
            type: 'line',
            datasetId: datasetId,
            showSymbol: false,
            name: symbol,
            endLabel: {
              show: true,
              formatter: function (params) {
                let symbol = params.seriesName;
                return `{${symbol}|${params.value[0].replace("usdt", "") + ': ' + (params.value[1] ? Number((Number(params.value[1]) - 1) * 100).toFixed(2) + "%" : "--")}}`;
              },
              rich: globalColor
            },
            color: globalColor[symbol].color,
            labelLayout: {
              moveOverlap: 'shiftY'
            },
            emphasis: {
              focus: 'series'
            },
            encode: {
              x: 'Time',
              y: 'Price',
              label: ['Symbol', 'Price'],
              itemName: 'Time',
              tooltip: ['Price']
            }
          });
        });
        option = {
          dataset: [
            {
              id: 'dataset_raw',
              source: _rawData
            },
            ...datasetWithFilters
          ],
          title: {
            text: `价格波动 (${currentInterval})`
          },
          tooltip: {
            order: 'valueDesc',
            trigger: 'axis'
          },
          xAxis: {
            type: 'time',
            nameLocation: 'middle',
            axisLabel: {
              formatter: function (value) {
                return new Date(value).Format('yyyy-MM-dd hh:mm')
              }
            },
          },
          yAxis: {
            name: 'Price',
            max: 1.2,
            min: 0.8
          },
          grid: {
            right: 140
          },
          series: seriesList
        };
        myChart.setOption(option);
      }

      $('#interval-select').on('change', function () {
        currentInterval = $(this).val();
        socketClient && socketClient.close();
        init();
      });
 
    });
  </script>
</body>

</html>
