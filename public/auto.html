<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binance Position Terminal（静态版）</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#0f1720; color:#e6edf3; margin:0; }
      .container { max-width:1100px; margin:28px auto; padding:20px; }
      header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      h1 { margin:0; font-size:20px; }
      .sub { color:#9aa4b2; font-size:13px; }
      .card { background:#0b1220; border:1px solid #172033; padding:16px; border-radius:8px; margin-top:18px; }
      table { width:100%; border-collapse:collapse; margin-top:8px; }
      th,td { text-align:left; padding:8px; border-bottom:1px dashed #12202a; font-size:13px; }
      .muted { color:#7f8a94; font-size:13px; }
      .small { font-size:12px; }
      .btn { background:#2563eb; color:#fff; padding:8px 12px; border-radius:6px; border:none; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>Binance Position Terminal（静态版）</h1>
          <div class="sub">简化界面</div>
        </div>
      </header>

      <div class="card">
        <strong>API 凭证 & 模式</strong>
        <div class="muted small">请在此处本地保存 API Key/Secret（仅保存在本地浏览器）。</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
          <input id="api-key" placeholder="API Key" class="small" style="flex:1; padding:8px; border-radius:6px; border:1px solid #152235; background:#07101a; color:#e6edf3;" />
          <input id="api-secret" placeholder="API Secret" class="small" style="flex:1; padding:8px; border-radius:6px; border:1px solid #152235; background:#07101a; color:#e6edf3;" />
        </div>
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
          <button id="save-creds" class="btn">保存凭证</button>
          <button id="clear-creds" class="btn" style="background:#9ca3af;">清除凭证</button>
          <button id="fetch-account" class="btn" style="background:#10b981;">获取持仓</button>
        </div>
        <div id="cred-msg" class="muted small" style="margin-top:8px;"></div>
      </div>

      <div class="card">
        <strong>账户与持仓</strong>
        <div class="muted small">点击"获取持仓"从币安实时拉取账户持仓（需先保存 API Key/Secret）。</div>
        <table id="positions-table" style="display:none;">
          <thead>
            <tr><th>标的</th><th>类型</th><th>方向</th><th>数量</th><th>开仓/订单价</th><th>当前/委托价</th><th>未实现盈亏/状态</th></tr>
          </thead>
          <tbody id="positions-body">
            <!-- 动态填充 -->
          </tbody>
        </table>
        <div id="no-positions-msg" class="muted small" style="margin-top:8px; display:none;">暂无持仓</div>
      </div>

      <div class="card">
        <strong>下单（限价订单）</strong>
        <div class="muted small">使用限价订单模式，手填交易对、数量与限价。</div>
        <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
          <input id="symbol" placeholder="交易对（如 BTCUSDT）" class="small" style="flex:1; padding:8px; border-radius:6px; border:1px solid #152235; background:#07101a; color:#e6edf3;" />
          <select id="side" class="small">
            <option>BUY</option>
            <option>SELL</option>
          </select>
          <input id="qty" placeholder="数量" class="small" style="padding:8px; border-radius:6px; border:1px solid #152235; background:#07101a; color:#e6edf3;" />
          <input id="limit-price" placeholder="限价" class="small" style="padding:8px; border-radius:6px; border:1px solid #152235; background:#07101a; color:#e6edf3;" />
          <button id="place-order" class="btn">下单</button>
        </div>
        <div id="order-result" class="muted small" style="margin-top:10px;"></div>
      </div>

      <footer class="muted small" style="text-align:center; margin-top:18px;">已移除模块列表: 待买入关注区预警, AI 交易习惯深度诊断与高阶统计报表, AI 大模型习惯诊断书, 平仓收益率追踪曲线, 策略哨兵配置与安全评级, 策略哨兵与突发异动预警流水线。</footer>
    </div>

    <script>
      // Helper
      const byId = id => document.getElementById(id);

      function fmt(n){ return typeof n==='number' ? n.toFixed(4) : n; }

      // Load stored creds
      function loadCreds(){
        byId('api-key').value = localStorage.getItem('binance_api_key') || '';
        byId('api-secret').value = localStorage.getItem('binance_api_secret') || '';
        const k = byId('api-key').value;
        byId('cred-msg').textContent = k ? '已加载本地凭证（仅浏览器本地存储）' : '未检测到本地凭证，处于未登录状态。';
      }

      // Save / Clear
      byId('save-creds').addEventListener('click', ()=>{
        const k = byId('api-key').value.trim();
        const s = byId('api-secret').value.trim();
        if(!k || !s){ byId('cred-msg').textContent = '请同时填写 API Key 与 API Secret 后保存。'; return; }
        localStorage.setItem('binance_api_key', k);
        localStorage.setItem('binance_api_secret', s);
        byId('cred-msg').textContent = '凭证已保存到本地浏览器。';
      });

      byId('clear-creds').addEventListener('click', ()=>{
        localStorage.removeItem('binance_api_key');
        localStorage.removeItem('binance_api_secret');
        byId('api-key').value=''; byId('api-secret').value='';
        byId('cred-msg').textContent = '凭证已清除。';
      });

      // Render positions and open orders
      function renderPositions(positionList, orderList){
        const tbody = byId('positions-body');
        const table = byId('positions-table');
        const noMsg = byId('no-positions-msg');
        tbody.innerHTML='';
        
        // Filter positions to only non-zero
        const filteredPos = (positionList || []).filter(p => Number(p.positionAmt) !== 0);
        // Filter orders to only open ones
        const filteredOrders = (orderList || []).filter(o => o.status === 'NEW' || o.status === 'PARTIALLY_FILLED');
        
        if(filteredPos.length === 0 && filteredOrders.length === 0){ 
          table.style.display = 'none';
          noMsg.style.display = 'block';
          return; 
        }
        
        table.style.display = 'table';
        noMsg.style.display = 'none';
        
        // Render positions
        filteredPos.forEach(p => {
          const direction = (Number(p.positionAmt) > 0) ? 'LONG' : (Number(p.positionAmt) < 0 ? 'SHORT' : 'FLAT');
          const qty = Math.abs(Number(p.positionAmt));
          const entry = p.entryPrice || p.entry_price || p.entry;
          const mark = p.markPrice || p.mark_price || p.mark || p.currentPrice || p.price;
          const upl = p.unRealizedProfit!==undefined ? p.unRealizedProfit : p.unrealizedProfit || p.unrealized_profit || 0;
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${p.symbol}</td><td>持仓</td><td>${direction}</td><td>${fmt(qty)}</td><td>${fmt(Number(entry)||0)}</td><td>${fmt(Number(mark)||0)}</td><td>${fmt(Number(upl)||0)}</td>`;
          tbody.appendChild(tr);
        });
        
        // Render open orders
        filteredOrders.forEach(o => {
          const tr = document.createElement('tr');
          const qty = Number(o.origQty) - Number(o.executedQty);
          const price = Number(o.price);
          const status = o.status === 'PARTIALLY_FILLED' ? '部分成交' : '未成交';
          tr.innerHTML = `<td>${o.symbol}</td><td>挂单</td><td>${o.side}</td><td>${fmt(qty)}</td><td>${fmt(price)}</td><td>${fmt(price)}</td><td>${status}</td>`;
          tbody.appendChild(tr);
        });
      }

      // Fetch account / positions / open orders (client-side direct to Binance)
      byId('fetch-account').addEventListener('click', async ()=>{
        const msg = byId('cred-msg'); msg.textContent = '正在请求...';
        const apiKey = localStorage.getItem('binance_api_key') || byId('api-key').value.trim();
        const apiSecret = localStorage.getItem('binance_api_secret') || byId('api-secret').value.trim();
        if(!apiKey || !apiSecret){ msg.textContent = '需要先保存 API Key 与 Secret。'; return; }

        try{
          const base = 'https://fapi.binance.com';
          const [positionResp, orderResp] = await Promise.all([
            binanceSignedRequest({ 
              method:'GET', 
              base, 
              endpoint:'/fapi/v2/positionRisk', 
              params:{ recvWindow:10000, timestamp: Date.now() }, 
              apiKey, 
              apiSecret 
            }),
            binanceSignedRequest({ 
              method:'GET', 
              base, 
              endpoint:'/fapi/v1/openOrders', 
              params:{ recvWindow:10000, timestamp: Date.now() }, 
              apiKey, 
              apiSecret 
            })
          ]);
          
          if(!positionResp){ msg.textContent = '获取持仓失败（无响应）'; return; }
          if(positionResp.code || positionResp.msg || positionResp.message){ msg.textContent = '获取持仓失败：' + (positionResp.msg||positionResp.message||JSON.stringify(positionResp)); return; }
          
          const positions = Array.isArray(positionResp) ? positionResp.map(p => ({
            symbol: p.symbol,
            positionAmt: Number(p.positionAmt),
            entryPrice: Number(p.entryPrice),
            markPrice: Number(p.markPrice),
            unRealizedProfit: Number(p.unRealizedProfit)
          })) : [];
          
          const orders = Array.isArray(orderResp) ? orderResp : [];
          
          renderPositions(positions, orders);
          msg.textContent = '持仓与挂单已更新（来自币安实盘）。';
        }catch(e){ msg.textContent = '请求出错：' + e.message; }
      });

      // Place order (client-side signed request to Binance)
      byId('place-order').addEventListener('click', async ()=>{
        const symbol = byId('symbol').value.trim().toUpperCase();
        const side = byId('side').value;
        const qty = byId('qty').value.trim();
        const limitPrice = byId('limit-price').value.trim();
        const out = byId('order-result'); out.textContent='';
        if(!symbol){ out.textContent='请输入交易对'; return; }
        if(!qty){ out.textContent='请输入数量'; return; }
        if(!limitPrice){ out.textContent='请输入限价'; return; }

        const apiKey = localStorage.getItem('binance_api_key') || byId('api-key').value.trim();
        const apiSecret = localStorage.getItem('binance_api_secret') || byId('api-secret').value.trim();
        if(!apiKey || !apiSecret){ out.textContent = '请先保存 API 凭证。'; return; }

        try{
          out.textContent = '下单中...';
          const base = 'https://fapi.binance.com';
          const params = { symbol, side, type: 'LIMIT', quantity: qty, price: limitPrice, timeInForce: 'GTC', timestamp: Date.now(), recvWindow: 10000 };
          const resp = await binanceSignedRequest({ method:'POST', base, endpoint:'/fapi/v1/order', params, apiKey, apiSecret });
          if(!resp){ out.textContent = '下单失败（无响应）'; return; }
          if(resp.code || resp.msg || resp.message){ out.textContent = '下单失败: ' + (resp.msg || resp.message || JSON.stringify(resp)); return; }
          out.textContent = '下单成功: ' + JSON.stringify(resp);
          // refresh positions briefly
          setTimeout(() => byId('fetch-account').click(), 1500);
        }catch(e){ out.textContent = '下单请求出错：' + e.message; }
      });

      // HMAC helper using Web Crypto
      async function hmacSignHex(secret, message) {
        const enc = new TextEncoder();
        const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
        const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
        return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2,'0')).join('');
      }

      // Perform signed request to Binance Futures API directly from browser
      async function binanceSignedRequest({ method='GET', base, endpoint, params={}, apiKey, apiSecret }){
        // Build query string
        const qs = new URLSearchParams();
        Object.keys(params).forEach(k => qs.append(k, String(params[k])));
        const paramString = qs.toString();
        const signature = await hmacSignHex(apiSecret, paramString);
        const finalQs = paramString ? (paramString + '&signature=' + signature) : ('signature=' + signature);

        if(method === 'GET'){
          const url = base + endpoint + '?' + finalQs;
          const res = await fetch(url, { headers: { 'X-MBX-APIKEY': apiKey } });
          return await res.json();
        } else {
          const url = base + endpoint;
          const res = await fetch(url, { method:'POST', headers: { 'X-MBX-APIKEY': apiKey, 'Content-Type':'application/x-www-form-urlencoded' }, body: finalQs });
          return await res.json();
        }
      }

      // init
      loadCreds();
    </script>
  </body>
</html>
